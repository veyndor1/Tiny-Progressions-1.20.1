<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title description">
  <title id="title">Tiny Progressions for Minecraft 1.20.1</title>
  <desc id="description">A dark blue banner with green and violet geometric blocks, representing a community Forge port of Tiny Progressions.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111b29"/><stop offset="1" stop-color="#20394a"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8d6d4" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#background)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect x="60" y="59" width="6" height="215" rx="3" fill="#87dfb4"/>
  <text x="91" y="89" fill="#87dfb4" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="4">MINECRAFT 1.20.1 · FORGE</text>
  <text x="88" y="158" fill="#f4f8fc" font-family="Arial, sans-serif" font-size="54" font-weight="bold">Tiny Progressions</text>
  <text x="91" y="204" fill="#c2d2df" font-family="Arial, sans-serif" font-size="23">Classic utilities for modern Minecraft.</text>
  <text x="91" y="263" fill="#94aabd" font-family="Arial, sans-serif" font-size="15">Community port · Original project by Kashdeya and contributors</text>
